<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vpsmon</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f7;
  --text: #101828;
  --muted: #526176;
  --border: #cccccc;
  --bar-bg: #e5eeee;
  --accent-start: #5aada8;
  --accent-end: #6d8fc2;
  --bar-fill: linear-gradient(90deg, var(--accent-start), var(--accent-end));
  --alert: #cc0000;
  --link: #5d80b5;
}
[data-theme="dark"] {
  --bg: #1a1a1a;
  --text: #e7f3ff;
  --muted: #94a9bd;
  --border: #333333;
  --bar-bg: #202d36;
  --accent-start: #28736f;
  --accent-end: #466797;
  --bar-fill: linear-gradient(90deg, var(--accent-start), var(--accent-end));
  --alert: #ff4444;
  --link: #7599d1;
  color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
  background: var(--bg);
  color: var(--text);
  padding: 1.5rem;
  max-width: 1200px;
  margin: 0 auto;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; }
.header-title { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
.controls { display: flex; gap: 1rem; align-items: center; }
.controls a { font-size: 0.85rem; }
.theme-switch { background: none; border: none; color: var(--link); cursor: pointer; font-family: inherit; font-size: 0.85rem; padding: 0; }
.theme-switch:hover { text-decoration: underline; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
.card { border: 1px solid var(--border); padding: 1.5rem 1rem 1rem; position: relative; background: transparent; display: flex; flex-direction: column; }
.card-title { position: absolute; top: -0.75rem; left: 0.5rem; background: var(--bg); padding: 0 0.5rem; font-weight: bold; font-size: 0.95rem; }
.metric-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; }
.bar-wrap { background: var(--bar-bg); height: 1.2rem; width: 100%; position: relative; margin-bottom: 0.8rem; }
.bar { background: var(--bar-fill); height: 100%; width: 0%; transition: width 0.3s; }
.bar-text { position: absolute; top: 0; left: 0.5rem; line-height: 1.2rem; font-size: 0.85rem; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { padding: 0.3rem 0; text-align: left; }
.td-right { text-align: right; }
.disconnected { color: var(--alert); text-align: center; margin-bottom: 1rem; display: none; }
.sparkline { width: 100%; height: 40px; margin-top: auto; padding-top: 1rem; }
.updated { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 2rem; }
.section-title { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; margin: 1rem 0 0.5rem; border-bottom: 1px dashed var(--border); }
.container-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem 1rem; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border); }
.container-row:last-child { border-bottom: 0; }
.container-summary { min-width: 0; }
.container-heading { display: flex; gap: 0.75rem; align-items: baseline; min-width: 0; }
.container-name { flex: 0 1 auto; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.container-image { min-width: 0; color: var(--muted); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.container-metrics { display: flex; flex-wrap: wrap; gap: 0.2rem 0.85rem; margin-top: 0.35rem; }
.container-meta { font-size: 0.8rem; white-space: nowrap; }
.container-meta-label { color: var(--muted); }
.container-actions { align-self: center; }
.log-button { border: 1px solid var(--border); background: transparent; color: var(--link); cursor: pointer; font-family: inherit; font-size: 0.8rem; padding: 0.35rem 0.6rem; }
.log-button:hover { text-decoration: underline; }
.container-log-output { display: none; grid-column: 1 / -1; max-height: 24rem; overflow: auto; margin: 0; padding: 0.75rem; border-top: 1px solid var(--border); background: var(--bar-bg); white-space: pre-wrap; font-size: 0.8rem; }
.container-row.logs-open .container-log-output { display: block; }
.card-scroll { max-height: 20rem; overflow: auto; }
.compact-empty { color: var(--muted); font-size: 0.8rem; padding: 0.5rem 0; text-align: center; }
.socket-row { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; padding: 0.4rem 0; border-bottom: 1px dashed var(--border); font-size: 0.85rem; }
.socket-row:last-child { border-bottom: 0; }
.socket-endpoint { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.socket-protocol { color: var(--muted); font-size: 0.75rem; margin-right: 0.45rem; }
.socket-scope { white-space: nowrap; }
.socket-scope-wildcard { color: var(--alert); font-weight: bold; }
.disk-row { padding: 0.4rem 0 0.6rem; border-bottom: 1px dashed var(--border); }
.disk-row:last-child { border-bottom: 0; padding-bottom: 0; }
.disk-mount { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.85rem; font-weight: bold; }
.disk-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 0.5rem 0; }
.disk-stat { display: flex; justify-content: space-between; gap: 0.4rem; font-size: 0.8rem; }
.disk-stat-label { color: var(--muted); }
@media (max-width: 520px) { .container-row { grid-template-columns: 1fr; } .container-actions { justify-self: start; } }
</style>
<script>
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = theme === 'light' ? 'Dark Mode' : 'Light Mode';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'light' ? 'dark' : 'light');
}
const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
setTheme(savedTheme);
</script>
</head>
<body>
<div id="offline-banner" class="disconnected">Offline / Reconnecting...</div>

<div class="header">
  <div>
    <div class="header-title">vpsmon <span id="hostname" style="font-size: 0.85rem; font-weight: normal; color: var(--muted);">--</span></div>
  </div>
  <div class="controls">
    <button class="theme-switch" id="theme-btn" onclick="toggleTheme()">Dark Mode</button>
    <a href="/logout">Logout</a>
  </div>
</div>

<div class="grid">
  <!-- CPU Card -->
  <div class="card">
    <div class="card-title">CPU (<span id="cpu-cores">--</span> Cores)</div>
    <div class="metric-row"><span>Load Average</span><span id="load-avg">--</span></div>
    
    <div class="bar-wrap" style="margin-top:1rem;">
      <div class="bar" id="cpu-bar"></div>
      <div class="bar-text">CPU <span id="cpu-usage">--</span></div>
    </div>
    
    <svg class="sparkline" id="cpu-chart"></svg>
    
    <div class="section-title">Top CPU</div>
    <table><tbody id="top-cpu"></tbody></table>
  </div>

  <!-- Memory Card -->
  <div class="card">
    <div class="card-title">Memory</div>
    <div class="metric-row"><span>Used</span><span id="mem-used">--</span></div>
    <div class="metric-row"><span>Total</span><span id="mem-total">--</span></div>
    
    <div class="bar-wrap" style="margin-top:1rem;">
      <div class="bar" id="mem-bar"></div>
      <div class="bar-text">RAM <span id="mem-usage-pct">--</span></div>
    </div>
    
    <div class="bar-wrap" id="swap-wrap">
      <div class="bar" id="swap-bar"></div>
      <div class="bar-text">Swap <span id="swap-usage-pct">--</span></div>
    </div>
    
    <svg class="sparkline" id="mem-chart"></svg>
    
    <div class="section-title">Top Memory</div>
    <table><tbody id="top-mem"></tbody></table>
  </div>

  <!-- Network & System Card -->
  <div class="card">
    <div class="card-title">Network & System</div>
    <div class="metric-row"><span>Uptime</span><span id="uptime">--</span></div>
    <div class="metric-row"><span>Processes</span><span id="procs">--</span></div>
    
    <div class="section-title">Traffic</div>
    <div class="metric-row"><span>Rx</span><span id="net-rx">--</span></div>
    <div class="metric-row"><span>Tx</span><span id="net-tx">--</span></div>
    
    <svg class="sparkline" id="net-chart"></svg>
  </div>

  <!-- Listening Sockets Card -->
  <div class="card">
    <div class="card-title">Listening Sockets (<span id="listener-count">0</span>)</div>
    <div class="card-scroll" id="listener-list"></div>
  </div>

  <!-- Disks Card -->
  <div class="card">
    <div class="card-title">Disks</div>
    <div class="card-scroll" id="disk-list"></div>
  </div>

  <!-- GPU Card -->
  <div class="card" id="gpu-card" style="display: none;">
    <div class="card-title">GPU</div>
    <div class="card-scroll" id="gpu-content"></div>
  </div>

  <!-- Docker Card -->
  <div class="card" id="docker-card" style="grid-column: 1 / -1; display: none;">
    <div class="card-title">Docker Containers</div>
    <div class="container-list" id="docker-list"></div>
  </div>

</div>

<div class="updated">Last updated: <span id="updated">--</span></div>

<script>
function fmt(bytes){
  if(bytes===0)return"0 B";
  const k=1024,s=["B","KB","MB","GB","TB"];
  const i=Math.floor(Math.log(bytes)/Math.log(k));
  return(bytes/Math.pow(k,i)).toFixed(1)+" "+s[i];
}
function setBar(id,pct){
  const el=document.getElementById(id);
  if (el) el.style.width=Math.min(pct,100)+"%";
}
function escapeHTML(value) {
  const element = document.createElement("div");
  element.textContent = String(value || "—");
  return element.innerHTML;
}
window.vpsmonOpenContainerLog = { id: null, text: "" };
function updateOpenContainerLog(id, text) {
  if (window.vpsmonOpenContainerLog.id !== id) return;
  window.vpsmonOpenContainerLog.text = text;
  const row = document.querySelector(`.container-row[data-container-id="${id}"]`);
  if (row) row.querySelector(".container-log-output").textContent = text;
}
async function toggleContainerLogs(button, id) {
  const row = button.closest(".container-row");
  const output = row.querySelector(".container-log-output");
  if (window.vpsmonOpenContainerLog.id === id) {
    window.vpsmonOpenContainerLog = { id: null, text: "" };
    row.classList.remove("logs-open");
    button.textContent = "logs";
    button.setAttribute("aria-expanded", "false");
    return;
  }

  if (window.vpsmonOpenContainerLog.id) {
    const previousRow = document.querySelector(`.container-row[data-container-id="${window.vpsmonOpenContainerLog.id}"]`);
    if (previousRow) {
      previousRow.classList.remove("logs-open");
      const previousButton = previousRow.querySelector(".log-button");
      previousButton.textContent = "logs";
      previousButton.setAttribute("aria-expanded", "false");
    }
  }
  window.vpsmonOpenContainerLog = { id, text: "Loading…" };
  row.classList.add("logs-open");
  button.textContent = "hide logs";
  button.setAttribute("aria-expanded", "true");
  output.textContent = window.vpsmonOpenContainerLog.text;
  try {
    const response = await fetch(`/api/containers/${encodeURIComponent(id)}/logs`);
    updateOpenContainerLog(id, response.ok ? await response.text() || "No logs available." : "Unable to load logs.");
  } catch (error) {
    updateOpenContainerLog(id, "Unable to load logs.");
  }
}
function drawSparkline(svgId, data, color) {
    const svg = document.getElementById(svgId);
    if (!svg || !data || data.length < 2) return;
    const w = 300, h = 40;
    const max = Math.max(...data) || 1;
    const pts = data.map((val, i) => `${(i / (data.length - 1)) * w},${h - (val / max) * h}`).join(" ");
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.innerHTML = `<polyline fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${pts}" />`;
}
function renderTop(id, procs, isMem) {
    const tbody = document.getElementById(id);
    if (!tbody) return;
    if (!procs || procs.length === 0) {
        tbody.innerHTML = "<tr><td colspan='2' style='color:var(--muted); text-align:center;'>N/A</td></tr>";
        return;
    }
    tbody.innerHTML = procs.map(p => `
        <tr>
            <td style="max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${p.name}">${p.name}</td>
            <td class="td-right">${(isMem ? p.mem : p.cpu).toFixed(1)}%</td>
        </tr>
    `).join("");
}

let evtSource;
function connectSSE() {
  evtSource = new EventSource("/api/metrics/stream");
  
  evtSource.onmessage = function(event) {
    document.getElementById("offline-banner").style.display = "none";
    try {
      const history = JSON.parse(event.data);
      if(history.length === 0) return;
      
      const d = history[history.length-1];
      
      document.getElementById("hostname").textContent=d.hostname;
      document.getElementById("cpu-usage").textContent=d.cpu_usage.toFixed(2)+"%";
      setBar("cpu-bar",d.cpu_usage);
      document.getElementById("cpu-cores").textContent=d.cpu_count;
      document.getElementById("load-avg").textContent=d.load_avg;
      
      document.getElementById("mem-used").textContent=fmt(d.mem_used);
      document.getElementById("mem-total").textContent=fmt(d.mem_total);
      document.getElementById("mem-usage-pct").textContent=d.mem_percent.toFixed(2)+"%";
      setBar("mem-bar",d.mem_percent);
      
      const swapWrap = document.getElementById("swap-wrap");
      if(d.swap_total>0){
        swapWrap.style.display = "block";
        document.getElementById("swap-usage-pct").textContent=d.swap_percent.toFixed(2)+"%";
        setBar("swap-bar",d.swap_percent);
      }else{
        swapWrap.style.display = "none";
      }
      
      document.getElementById("uptime").textContent=d.uptime;
      document.getElementById("procs").textContent=d.processes;
      document.getElementById("net-rx").textContent=fmt(d.net_rx_speed) + "/s";
      document.getElementById("net-tx").textContent=fmt(d.net_tx_speed) + "/s";

      const listeners = d.listeners || [];
      document.getElementById("listener-count").textContent = listeners.length;
      const listenerList = document.getElementById("listener-list");
      listenerList.replaceChildren();
      if (listeners.length === 0) {
        const empty = document.createElement("div");
        empty.className = "compact-empty";
        empty.textContent = "No listening sockets detected";
        listenerList.appendChild(empty);
      } else {
        listeners.forEach(socket => {
          const row = document.createElement("div");
          row.className = "socket-row";

          const endpoint = document.createElement("div");
          endpoint.className = "socket-endpoint";
          const address = socket.address.includes(":") ? `[${socket.address}]` : socket.address;
          endpoint.title = `${socket.protocol.toUpperCase()} ${address}:${socket.port}`;
          const protocol = document.createElement("span");
          protocol.className = "socket-protocol";
          protocol.textContent = socket.protocol.toUpperCase();
          endpoint.append(protocol, `${address}:${socket.port}`);

          const scope = document.createElement("div");
          scope.className = "socket-scope" + (socket.scope === "all interfaces" ? " socket-scope-wildcard" : "");
          scope.textContent = socket.scope === "loopback" ? "local only" : socket.scope;
          row.append(endpoint, scope);
          listenerList.appendChild(row);
        });
      }
      
      renderTop("top-cpu", d.top_cpu, false);
      renderTop("top-mem", d.top_mem, true);
      
      const disks = d.disks || [];
      const diskList = document.getElementById("disk-list");
      diskList.replaceChildren();
      if (disks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "compact-empty";
        empty.textContent = "No disks detected";
        diskList.appendChild(empty);
      } else {
        disks.forEach(disk => {
          const row = document.createElement("div");
          row.className = "disk-row";

          const mount = document.createElement("div");
          mount.className = "disk-mount";
          mount.textContent = disk.mount;
          mount.title = disk.mount;

          const stats = document.createElement("div");
          stats.className = "disk-stats";
          [["Total", disk.total], ["Free", disk.free]].forEach(([label, value]) => {
            const stat = document.createElement("div");
            stat.className = "disk-stat";
            const statLabel = document.createElement("span");
            statLabel.className = "disk-stat-label";
            statLabel.textContent = label;
            const statValue = document.createElement("span");
            statValue.textContent = fmt(value);
            stat.append(statLabel, statValue);
            stats.appendChild(stat);
          });

          const barWrap = document.createElement("div");
          barWrap.className = "bar-wrap";
          barWrap.style.height = "1rem";
          barWrap.style.marginBottom = "0";
          const bar = document.createElement("div");
          bar.className = "bar";
          bar.style.width = Math.min(Math.max(disk.percent, 0), 100) + "%";
          const barText = document.createElement("div");
          barText.className = "bar-text";
          barText.style.lineHeight = "1rem";
          barText.textContent = `${disk.percent.toFixed(2)}% used`;
          barWrap.append(bar, barText);

          row.append(mount, stats, barWrap);
          diskList.appendChild(row);
        });
      }
      
      const dockerCard = document.getElementById("docker-card");
      const dockerList = document.getElementById("docker-list");
      if(d.containers && d.containers.length > 0) {
        if (window.vpsmonOpenContainerLog.id && !d.containers.some(c => c.id === window.vpsmonOpenContainerLog.id)) {
          window.vpsmonOpenContainerLog = { id: null, text: "" };
        }
        dockerCard.style.display = "flex";
        // Keep an expanded log panel intact while live metrics arrive. Replacing
        // this markup every five seconds would otherwise close the panel and
        // discard the log text the user is reading.
        if (!(window.vpsmonOpenContainerLog.id && dockerList.querySelector(".container-row.logs-open"))) {
          dockerList.innerHTML = d.containers.map(c => `
          <div class="container-row${c.id === window.vpsmonOpenContainerLog.id ? " logs-open" : ""}" data-container-id="${c.id}">
            <div class="container-summary">
              <div class="container-heading"><span class="container-name" title="${escapeHTML(c.name)}">${escapeHTML(c.name)}</span><span class="container-image" title="${escapeHTML(c.image)}">${escapeHTML(c.image)}</span></div>
              <div class="container-metrics">
                <span class="container-meta"><span class="container-meta-label">status</span> ${escapeHTML(c.status)}</span>
                <span class="container-meta"><span class="container-meta-label">health</span> ${escapeHTML(c.health)}</span>
                <span class="container-meta"><span class="container-meta-label">up</span> ${escapeHTML(c.uptime)}</span>
                <span class="container-meta"><span class="container-meta-label">↻</span> ${c.restart_count}</span>
                <span class="container-meta"><span class="container-meta-label">CPU</span> ${c.cpu.toFixed(2)}%</span>
                <span class="container-meta"><span class="container-meta-label">RAM</span> ${c.mem.toFixed(2)}%</span>
              </div>
            </div>
            <div class="container-actions"><button class="log-button" type="button" data-container-id="${c.id}" aria-expanded="${c.id === window.vpsmonOpenContainerLog.id}">${c.id === window.vpsmonOpenContainerLog.id ? "hide logs" : "logs"}</button></div>
            <pre class="container-log-output">${c.id === window.vpsmonOpenContainerLog.id ? escapeHTML(window.vpsmonOpenContainerLog.text) : ""}</pre>
          </div>
        `).join("");
          dockerList.querySelectorAll(".log-button[data-container-id]").forEach(button => {
            button.addEventListener("click", () => toggleContainerLogs(button, button.dataset.containerId));
          });
        }
      } else {
        dockerCard.style.display = "none";
      }

      const gpuCard = document.getElementById("gpu-card");
      const gpuContent = document.getElementById("gpu-content");
      if(d.gpus && d.gpus.length > 0) {
        gpuCard.style.display = "flex";
        gpuContent.innerHTML = d.gpus.map(g => {
          const memoryPercent = g.memory_total > 0 ? (g.memory_used / g.memory_total) * 100 : 0;
          return `
            <div class="section-title">${g.name}</div>
            <div class="metric-row"><span>Utilization</span><span>${g.utilization.toFixed(0)}%</span></div>
            <div class="bar-wrap"><div class="bar" style="width:${Math.min(g.utilization, 100)}%"></div><div class="bar-text">GPU ${g.utilization.toFixed(0)}%</div></div>
            <div class="metric-row"><span>VRAM</span><span>${fmt(g.memory_used)} / ${fmt(g.memory_total)}</span></div>
            <div class="bar-wrap"><div class="bar" style="width:${Math.min(memoryPercent, 100)}%"></div><div class="bar-text">VRAM ${memoryPercent.toFixed(0)}%</div></div>
            <div class="metric-row"><span>Temperature</span><span>${g.temperature}°C</span></div>
          `;
        }).join("");
      } else {
        gpuCard.style.display = "none";
      }

      document.getElementById("updated").textContent=new Date(d.timestamp).toLocaleTimeString();
      
      const style = getComputedStyle(document.documentElement);
      const chartColor = style.getPropertyValue('--accent-end').trim() || 'blue';
      const textColor = style.getPropertyValue('--text').trim() || 'black';
      
      drawSparkline("cpu-chart", history.map(m => m.cpu_usage), textColor);
      drawSparkline("mem-chart", history.map(m => m.mem_percent), textColor);
      drawSparkline("net-chart", history.map(m => m.net_rx_speed), chartColor);
      
    } catch(e) {
      console.error(e);
    }
  };

  evtSource.onerror = async function(err) {
    console.error("SSE error", err);
    document.getElementById("offline-banner").style.display = "block";
    
    try {
      const r = await fetch("/");
      if (r.url.includes("/login")) {
        window.location = "/login";
      }
    } catch(e) {}
  };
}
connectSSE();

const curTheme = document.documentElement.getAttribute('data-theme');
const themeBtn = document.getElementById('theme-btn');
if(themeBtn) themeBtn.textContent = curTheme === 'light' ? 'Dark Mode' : 'Light Mode';
</script>
</body>
</html>
