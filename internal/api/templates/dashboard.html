<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vpsmon</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
:root {
  color-scheme: light dark;
  --bg: #f9f4f4;
  --text: #111111;
  --muted: #666666;
  --border: #cccccc;
  --bar-bg: #f1e6e6;
  --bar-fill: #f4cccc;
  --alert: #cc0000;
  --link: #0000ff;
}
[data-theme="dark"] {
  --bg: #1a1a1a;
  --text: #e0e0e0;
  --muted: #999999;
  --border: #333333;
  --bar-bg: #2a2a2a;
  --bar-fill: #804040;
  --alert: #ff4444;
  --link: #52a8ff;
  color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
  background: var(--bg);
  color: var(--text);
  padding: 1.5rem;
  max-width: 1200px;
  margin: 0 auto;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; }
.header-title { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
.controls { display: flex; gap: 1rem; align-items: center; }
.controls a { font-size: 0.85rem; }
.theme-switch { background: none; border: none; color: var(--link); cursor: pointer; font-family: inherit; font-size: 0.85rem; padding: 0; }
.theme-switch:hover { text-decoration: underline; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
.card { border: 1px solid var(--border); padding: 1.5rem 1rem 1rem; position: relative; background: transparent; display: flex; flex-direction: column; }
.card-title { position: absolute; top: -0.75rem; left: 0.5rem; background: var(--bg); padding: 0 0.5rem; font-weight: bold; font-size: 0.95rem; }
.metric-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; }
.bar-wrap { background: var(--bar-bg); height: 1.2rem; width: 100%; position: relative; margin-bottom: 0.8rem; }
.bar { background: var(--bar-fill); height: 100%; width: 0%; transition: width 0.3s; }
.bar-text { position: absolute; top: 0; left: 0.5rem; line-height: 1.2rem; font-size: 0.85rem; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { padding: 0.3rem 0; text-align: left; }
.td-right { text-align: right; }
.disconnected { color: var(--alert); text-align: center; margin-bottom: 1rem; display: none; }
.sparkline { width: 100%; height: 40px; margin-top: auto; padding-top: 1rem; }
.updated { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 2rem; }
.section-title { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; margin: 1rem 0 0.5rem; border-bottom: 1px dashed var(--border); }
</style>
<script>
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = theme === 'light' ? 'Dark Mode' : 'Light Mode';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'light' ? 'dark' : 'light');
}
const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
setTheme(savedTheme);
</script>
</head>
<body>
<div id="offline-banner" class="disconnected">Offline / Reconnecting...</div>

<div class="header">
  <div>
    <div class="header-title">vpsmon <span id="hostname" style="font-size: 0.85rem; font-weight: normal; color: var(--muted);">--</span></div>
  </div>
  <div class="controls">
    <button class="theme-switch" id="theme-btn" onclick="toggleTheme()">Dark Mode</button>
    <a href="/logout">Logout</a>
  </div>
</div>

<div class="grid">
  <!-- CPU Card -->
  <div class="card">
    <div class="card-title">CPU (<span id="cpu-cores">--</span> Cores)</div>
    <div class="metric-row"><span>Load Average</span><span id="load-avg">--</span></div>
    
    <div class="bar-wrap" style="margin-top:1rem;">
      <div class="bar" id="cpu-bar"></div>
      <div class="bar-text">CPU <span id="cpu-usage">--</span></div>
    </div>
    
    <svg class="sparkline" id="cpu-chart"></svg>
    
    <div class="section-title">Top CPU</div>
    <table><tbody id="top-cpu"></tbody></table>
  </div>

  <!-- Memory Card -->
  <div class="card">
    <div class="card-title">Memory</div>
    <div class="metric-row"><span>Used</span><span id="mem-used">--</span></div>
    <div class="metric-row"><span>Total</span><span id="mem-total">--</span></div>
    
    <div class="bar-wrap" style="margin-top:1rem;">
      <div class="bar" id="mem-bar"></div>
      <div class="bar-text">RAM <span id="mem-usage-pct">--</span></div>
    </div>
    
    <div class="bar-wrap" id="swap-wrap">
      <div class="bar" id="swap-bar"></div>
      <div class="bar-text">Swap <span id="swap-usage-pct">--</span></div>
    </div>
    
    <svg class="sparkline" id="mem-chart"></svg>
    
    <div class="section-title">Top Memory</div>
    <table><tbody id="top-mem"></tbody></table>
  </div>

  <!-- Network & System Card -->
  <div class="card">
    <div class="card-title">Network & System</div>
    <div class="metric-row"><span>Uptime</span><span id="uptime">--</span></div>
    <div class="metric-row"><span>Processes</span><span id="procs">--</span></div>
    
    <div class="section-title">Traffic</div>
    <div class="metric-row"><span>Rx</span><span id="net-rx">--</span></div>
    <div class="metric-row"><span>Tx</span><span id="net-tx">--</span></div>
    
    <svg class="sparkline" id="net-chart"></svg>
  </div>

  <!-- Disks Card -->
  <div class="card" style="grid-column: 1 / -1;">
    <div class="card-title">Disks</div>
    <table>
      <thead><tr><th>Mount</th><th class="td-right">Used</th><th class="td-right">Free</th><th class="td-right">Total</th></tr></thead>
      <tbody id="disk-table"></tbody>
    </table>
  </div>

  <!-- Docker Card -->
  <div class="card" id="docker-card" style="grid-column: 1 / -1; display: none;">
    <div class="card-title">Docker Containers</div>
    <table>
      <thead><tr><th>Name</th><th class="td-right">CPU</th><th class="td-right">RAM</th></tr></thead>
      <tbody id="docker-table"></tbody>
    </table>
  </div>
</div>

<div class="updated">Last updated: <span id="updated">--</span></div>

<script>
function fmt(bytes){
  if(bytes===0)return"0 B";
  const k=1024,s=["B","KB","MB","GB","TB"];
  const i=Math.floor(Math.log(bytes)/Math.log(k));
  return(bytes/Math.pow(k,i)).toFixed(1)+" "+s[i];
}
function setBar(id,pct){
  const el=document.getElementById(id);
  if (el) el.style.width=Math.min(pct,100)+"%";
}
function drawSparkline(svgId, data, color) {
    const svg = document.getElementById(svgId);
    if (!svg || !data || data.length < 2) return;
    const w = 300, h = 40;
    const max = Math.max(...data) || 1;
    const pts = data.map((val, i) => `${(i / (data.length - 1)) * w},${h - (val / max) * h}`).join(" ");
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.innerHTML = `<polyline fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${pts}" />`;
}
function renderTop(id, procs, isMem) {
    const tbody = document.getElementById(id);
    if (!tbody) return;
    if (!procs || procs.length === 0) {
        tbody.innerHTML = "<tr><td colspan='2' style='color:var(--muted); text-align:center;'>N/A</td></tr>";
        return;
    }
    tbody.innerHTML = procs.map(p => `
        <tr>
            <td style="max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${p.name}">${p.name}</td>
            <td class="td-right">${(isMem ? p.mem : p.cpu).toFixed(1)}%</td>
        </tr>
    `).join("");
}

let evtSource;
function connectSSE() {
  evtSource = new EventSource("/api/metrics/stream");
  
  evtSource.onmessage = function(event) {
    document.getElementById("offline-banner").style.display = "none";
    try {
      const history = JSON.parse(event.data);
      if(history.length === 0) return;
      
      const d = history[history.length-1];
      
      document.getElementById("hostname").textContent=d.hostname;
      document.getElementById("cpu-usage").textContent=d.cpu_usage.toFixed(2)+"%";
      setBar("cpu-bar",d.cpu_usage);
      document.getElementById("cpu-cores").textContent=d.cpu_count;
      document.getElementById("load-avg").textContent=d.load_avg;
      
      document.getElementById("mem-used").textContent=fmt(d.mem_used);
      document.getElementById("mem-total").textContent=fmt(d.mem_total);
      document.getElementById("mem-usage-pct").textContent=d.mem_percent.toFixed(2)+"%";
      setBar("mem-bar",d.mem_percent);
      
      const swapWrap = document.getElementById("swap-wrap");
      if(d.swap_total>0){
        swapWrap.style.display = "block";
        document.getElementById("swap-usage-pct").textContent=d.swap_percent.toFixed(2)+"%";
        setBar("swap-bar",d.swap_percent);
      }else{
        swapWrap.style.display = "none";
      }
      
      document.getElementById("uptime").textContent=d.uptime;
      document.getElementById("procs").textContent=d.processes;
      document.getElementById("net-rx").textContent=fmt(d.net_rx_speed) + "/s";
      document.getElementById("net-tx").textContent=fmt(d.net_tx_speed) + "/s";
      
      renderTop("top-cpu", d.top_cpu, false);
      renderTop("top-mem", d.top_mem, true);
      
      const tbody=document.getElementById("disk-table");
      tbody.innerHTML="";
      (d.disks||[]).forEach(dk=>{
        const tr=document.createElement("tr");
        tr.innerHTML="<td>"+dk.mount+"</td><td class='td-right'>"+fmt(dk.used)+"</td><td class='td-right'>"+fmt(dk.free)+"</td><td class='td-right'>"+fmt(dk.total)+"</td>";
        tbody.appendChild(tr);
        
        const trBar=document.createElement("tr");
        trBar.innerHTML="<td colspan='4' style='padding-top:0;'><div class='bar-wrap' style='height:1rem; margin-bottom:0.5rem;'><div class='bar' style='width:"+dk.percent.toFixed(0)+"%'></div><div class='bar-text'>Disk "+dk.percent.toFixed(2)+"%</div></div></td>";
        tbody.appendChild(trBar);
      });
      
      const dockerCard = document.getElementById("docker-card");
      const dockerTbody = document.getElementById("docker-table");
      if(d.containers && d.containers.length > 0) {
        dockerCard.style.display = "flex";
        dockerTbody.innerHTML = d.containers.map(c => `
          <tr>
            <td>${c.name}</td>
            <td class="td-right">${c.cpu.toFixed(2)}%</td>
            <td class="td-right">${c.mem.toFixed(2)}%</td>
          </tr>
        `).join("");
      } else {
        dockerCard.style.display = "none";
      }

      document.getElementById("updated").textContent=new Date(d.timestamp).toLocaleTimeString();
      
      const style = getComputedStyle(document.documentElement);
      const alertColor = style.getPropertyValue('--alert').trim() || 'red';
      const textColor = style.getPropertyValue('--text').trim() || 'black';
      
      drawSparkline("cpu-chart", history.map(m => m.cpu_usage), textColor);
      drawSparkline("mem-chart", history.map(m => m.mem_percent), textColor);
      drawSparkline("net-chart", history.map(m => m.net_rx_speed), alertColor);
      
    } catch(e) {
      console.error(e);
    }
  };

  evtSource.onerror = async function(err) {
    console.error("SSE error", err);
    document.getElementById("offline-banner").style.display = "block";
    
    try {
      const r = await fetch("/");
      if (r.url.includes("/login")) {
        window.location = "/login";
      }
    } catch(e) {}
  };
}
connectSSE();

const curTheme = document.documentElement.getAttribute('data-theme');
const themeBtn = document.getElementById('theme-btn');
if(themeBtn) themeBtn.textContent = curTheme === 'light' ? 'Dark Mode' : 'Light Mode';
</script>
</body>
</html>
