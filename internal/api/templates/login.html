<!DOCTYPE html>
<html lang="en" data-skin="{{SKIN}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - vpsmon</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/{{SKIN}}.css">

<script>
const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
document.documentElement.setAttribute('data-theme', savedTheme);
</script>
</head>
<body class="login-page">
<div class="login-card">
  <div class="card-title"><img class="brand-mark" src="/favicon.ico" alt="">vpsmon</div>
  {{LOGIN_ERROR}}
  <form method="post" action="/login">
    <label class="field-label" for="username">Username</label>
    <input id="username" type="text" name="username" placeholder="username" autocomplete="username" required autofocus>
    <label class="field-label" for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="password" autocomplete="current-password" required>
    <button type="submit"><span class="terminal-submit">authenticate</span><span class="modern-submit">Sign in</span></button>
  </form>
</div>
</body>
</html>
