<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - vpsmon</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
:root {
  color-scheme: light dark;
  --bg: #f9f4f4;
  --text: #111111;
  --muted: #666666;
  --border: #cccccc;
  --bar-bg: #f1e6e6;
  --bar-fill: #f4cccc;
  --alert: #cc0000;
  --link: #0000ff;
}
[data-theme="dark"] {
  --bg: #1a1a1a;
  --text: #e0e0e0;
  --muted: #999999;
  --border: #333333;
  --bar-bg: #2a2a2a;
  --bar-fill: #804040;
  --alert: #ff4444;
  --link: #52a8ff;
  color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.card {
  border: 1px solid var(--border);
  padding: 2rem;
  width: 100%;
  max-width: 380px;
  background: transparent;
  position: relative;
}
.card-title {
  position: absolute;
  top: -0.75rem;
  left: 0.5rem;
  background: var(--bg);
  padding: 0 0.5rem;
  font-weight: bold;
  font-size: 1.1rem;
}
input {
  width: 100%;
  padding: 0.75rem;
  margin-bottom: 1rem;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 0.95rem;
}
input:focus {
  outline: none;
  border-color: var(--text);
}
button {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid var(--text);
  background: var(--text);
  color: var(--bg);
  font-family: inherit;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: opacity 0.2s;
}
button:hover {
  opacity: 0.8;
}
</style>
<script>
const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
document.documentElement.setAttribute('data-theme', savedTheme);
</script>
</head>
<body>
<div class="card">
  <div class="card-title">vpsmon</div>
  <form method="post" action="/login">
    <input type="text" name="username" placeholder="username" required autofocus>
    <input type="password" name="password" placeholder="password" required>
    <button type="submit">authenticate</button>
  </form>
</div>
</body>
</html>
