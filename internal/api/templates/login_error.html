<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - vpsmon</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f7;
  --text: #101828;
  --muted: #526176;
  --border: #cccccc;
  --bar-bg: #e5eeee;
  --accent-start: #5aada8;
  --accent-end: #6d8fc2;
  --bar-fill: linear-gradient(90deg, var(--accent-start), var(--accent-end));
  --alert: #cc0000;
  --link: #5d80b5;
}
[data-theme="dark"] {
  --bg: #1a1a1a;
  --text: #e7f3ff;
  --muted: #94a9bd;
  --border: #333333;
  --bar-bg: #202d36;
  --accent-start: #63b7b1;
  --accent-end: #7599d1;
  --bar-fill: linear-gradient(90deg, var(--accent-start), var(--accent-end));
  --alert: #ff4444;
  --link: #7599d1;
  color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.card {
  border: 1px solid var(--border);
  padding: 2rem;
  width: 100%;
  max-width: 380px;
  background: transparent;
  position: relative;
}
.card-title {
  position: absolute;
  top: -0.75rem;
  left: 0.5rem;
  background: var(--bg);
  padding: 0 0.5rem;
  font-weight: bold;
  font-size: 1.1rem;
}
.error {
  color: var(--alert);
  border: 1px dashed var(--alert);
  padding: 0.75rem;
  margin-bottom: 1rem;
  text-align: center;
  font-size: 0.9rem;
}
input {
  width: 100%;
  padding: 0.75rem;
  margin-bottom: 1rem;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 0.95rem;
}
input:focus {
  outline: none;
  border-color: var(--accent-end);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-start) 35%, transparent);
}
button {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid transparent;
  background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
  color: #ffffff;
  font-family: inherit;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: opacity 0.2s;
}
button:hover {
  opacity: 0.8;
}
</style>
<script>
const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
document.documentElement.setAttribute('data-theme', savedTheme);
</script>
</head>
<body>
<div class="card">
  <div class="card-title">vpsmon</div>
  <div class="error">Invalid username or password</div>
  <form method="post" action="/login">
    <input type="text" name="username" placeholder="username" required autofocus>
    <input type="password" name="password" placeholder="password" required>
    <button type="submit">authenticate</button>
  </form>
</div>
</body>
</html>
