version: '3.8'

services:
  vpsmon:
    build: .
    container_name: vpsmon
    restart: unless-stopped
    # Use the host's PID namespace so 'ps' can see all host processes.
    pid: host
    # Publish the dashboard outside the container for local testing.
    ports:
      - "8089:8088"
    environment:
      # Pass your pre-generated hash here or in a .env file next to this docker-compose.yml
      - MONITOR_PASS_HASH=${MONITOR_PASS_HASH}
    volumes:
      # Required for Docker container metadata, stats, and on-demand logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
