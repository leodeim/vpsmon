services:
  vpsmon:
    build: .
    container_name: vpsmon
    restart: unless-stopped
    # Use the host's PID namespace so 'ps' can see all host processes.
    pid: host
    # Publish the dashboard outside the container for local testing.
    ports:
      - "8089:8088"
    environment:
      # Required unless MONITOR_NO_AUTH=true; the container exits without it.
      # Generate with: docker compose run --rm vpsmon ./vpsmon -hash 'your-password'
      # In a .env file next to this docker-compose.yml, wrap the hash in single quotes.
      - MONITOR_PASS_HASH=${MONITOR_PASS_HASH:-}
      # Set to true only when access is protected by a private network or authenticating proxy.
      - MONITOR_NO_AUTH=${MONITOR_NO_AUTH:-false}
      # Choose terminal (default) or modern; this is fixed for all dashboard visitors.
      - MONITOR_SKIN=${MONITOR_SKIN:-terminal}
      # Add the source IP/CIDR of any reverse proxy outside this container.
      - MONITOR_TRUSTED_PROXIES=${MONITOR_TRUSTED_PROXIES-loopback}
    volumes:
      # Required for Docker container metadata, stats, and on-demand logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
